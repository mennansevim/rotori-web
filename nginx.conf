# Rotori tanıtım sitesi — nginx statik konfigürasyonu.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip: HTML + CSS + inline JS + SVG için ~%70 kazanım.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Ana konum — SPA olmasa bile try_files zararsız.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML kısa cache — içerik güncellendiğinde hızlı yansır.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Statik asset uzun cache — ancak dosya adı değişince natural busting.
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Sağlık kontrolü — Cloudflare Tunnel bunu ping'lemez, ama debug için.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Güvenlik başlıkları — Cloudflare de bazılarını override edebilir.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
